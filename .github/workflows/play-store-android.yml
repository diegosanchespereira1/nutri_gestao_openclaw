name: Play Store — Android

# Não corre no deploy do site. Só em tag de versão (v1.2.26) ou disparo manual.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      track:
        description: Faixa da Play Store
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal
      status:
        description: Estado da release
        type: choice
        options:
          - completed
          - draft
        default: completed
      changes_not_sent_for_review:
        description: Gravar o edit sem enviar para revisão (use se a consola tiver declarações pendentes)
        type: boolean
        default: false

concurrency:
  group: play-store-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: AAB assinado → Play Store
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: play-store

    env:
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nutrigestao-release.keystore
      KEYSTORE_PATH: ${{ runner.temp }}/nutrigestao-release.keystore
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Validate Play Store secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 em falta. Ver docs/mobile/PLAY-STORE-GITHUB-ACTIONS.md"
            missing=1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_PASSWORD em falta."
            missing=1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Secret ANDROID_KEY_ALIAS em falta (ex.: nutrigestao)."
            missing=1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Secret ANDROID_KEY_PASSWORD em falta."
            missing=1
          fi
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON em falta."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read app versions
        id: ver
        run: |
          name="$(node -p "require('./package.json').version")"
          code="$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -1)"
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::Não foi possível ler versionName/versionCode."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Versão $name (versionCode $code)"

      - name: Require tag to match package.json
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.ver.outputs.name }}" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não coincide com package.json (${{ steps.ver.outputs.name }}). Corre npm run version:bump-patch, faz commit e cria a tag v${{ steps.ver.outputs.name }}."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

      - name: Capacitor sync (Android)
        run: npx cap sync android && node scripts/mobile/ensure-android-package-id.mjs

      - name: Check keystore
        run: node scripts/mobile/check-android-release-keystore.mjs

      - name: Build signed AAB
        run: node scripts/mobile/run-android-gradle.mjs bundleRelease --no-daemon --stacktrace

      - name: Prepare release notes
        run: |
          mkdir -p android/whatsnew
          printf '%s\n' \
            "NutriGestão ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})." \
            "Casca nativa Capacitor. O conteúdo da app continua a vir de produção." \
            > android/whatsnew/whatsnew-pt-BR

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutrigestao-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.nutrigestao.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ github.event.inputs.track || 'internal' }}
          status: ${{ github.event.inputs.status || 'completed' }}
          releaseName: ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})
          whatsNewDirectory: android/whatsnew
          changesNotSentForReview: ${{ inputs.changes_not_sent_for_review == true }}
